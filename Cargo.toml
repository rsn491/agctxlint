[package]
name = "ctxlint"
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
description = "A linter for agent instruction files: AGENTS.md, SKILL.md, and friends."
license = "MIT"

[[bin]]
name = "ctxlint"
path = "src/main.rs"

[dependencies]
saphyr = "0.0.11"
regex = "1"
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
